narrative: |
  ## Generation of new ideas, tools, methodologies or knowledge

  My contributions span high-impact datasets and software, leadership of collaborations, and sustained public engagement. My work spans galaxy dynamics and structure, cluster formation and evolution, novel data analysis, and the integration of surveys with simulation data, communicated through refereed papers, conference talks, and public activities. My work as an early member of the Galaxy Zoo team was instrumental in showing that citizen science could produce valuable datasets and has since extended to demonstrating the power of AI in analysing galaxy surveys; the Galaxy Zoo team has published 86 refereed papers and the data has been used in hundreds more. I was on the leadership team for the GAMA Survey, one of the largest redshift surveys at the time, distinguished by consistently tracing structure from kpc to Mpc scales; GAMA data has been used in over 700 refereed publications (~40,000 citations). As PI of the MegaMorph project, I developed multi-wavelength galaxy modelling into a widely-used tool, now used by dozens of groups and contributing to over 60 publications. I co-lead a team processing Euclid data to measure ICL in 80,000 clusters – the primary data source for ICL studies for the next decade. These projects demonstrate my ability to develop sophisticated approaches to complex challenges, drawing on skills in data analysis, pipeline development, and linking simulations to observations.

  ## Development of others and maintenance of effective working relationships

  I have supervised a dozen PhD students and PDRAs, emphasising independence, skills, and professional networks. Former mentees have acheived senior roles as data scientists, research astronomers, and academics.  Alongside research leadership, I have contributed substantially to teaching administration at Nottingham as First-Year Lead, Digital Learning Lead, and Exams Officer, developing processes that improve efficiency and reliability for colleagues.

  ## Wider research and innovation community

   My service activites include the ING Panel for the Allocation of Telescope Time (open time for the UK community on the Isaac Newton Group of Telescopes) and founding Science Director of the Zooniverse, which has brought citizen science to a wide range of disciplines and enabled hundreds of research groups to work at scale; Zooniverse projects have led directly to over 600 publications. I co-lead the Machine Learning in Science MSc, training students to apply AI to scientific problems.

  ## Broader research/innovation audiences and wider societal benefit

  Our outreach spans large-scale public participation and targeted engagement with the media and policy. Galaxy Zoo and the Zooniverse have involved millions of the public in genuine research across astronomy and beyond, engaging everyone from school children to retirees and providing training data that has been vital to the development of AI in science. I has presented this work in public talks, online videos, a television documentary, and a planetarium show; my [Galaxy Writer](https://writing.galaxyzoo.org) site remains in regular use worldwide for education and entertainment. 

