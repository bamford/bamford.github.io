{% assign _cv_dataset = page.cv_dataset | default: "cv" %}
{% assign _cv = site.data[_cv_dataset] %}
<head>
    <!-- Styles -->
    <link rel="stylesheet" href="{{'/assets/css/cv_main.css' | relative_url}}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.ico">
    
    <title>{% if _cv.name %}{{ _cv.name }}{% else %}{{ site.title }}{% endif %} &mdash; CV</title>
</head>
