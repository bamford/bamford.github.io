{% assign cv = include.cv | default: site.data.cv %}
{% assign ops = cv.operations %}
{% if ops %}
<section class="projects{% include cv/print-page-break-class.html cv=cv slug="operations" %}">
    <h2 class="title">Administration and Operations</h2>
    {% for p in ops %}
        <div class="project">
	  <span class="name">{{p.title}}</span>
	  <span class="details">— {{p.details | markdownify}}</span>
        </div>
    {% endfor %}
</section>
{% endif %}
