{% assign cv = include.cv | default: site.data.cv %}
{% assign profile = cv.profile %}
{% if profile %}
<section class="career-profile{% include cv/print-page-break-class.html cv=cv slug="career-profile" %}">
    <h2 class="title">Career Profile</h2>
    <div class="details">{{profile}}</div>
</section>
{% endif %}
