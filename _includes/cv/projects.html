{% assign cv = include.cv | default: site.data.cv %}
{% assign projects = cv.projects %}
{% if projects %}
<section class="projects{% include cv/print-page-break-class.html cv=cv slug="projects" %}">
    <h2 class="title">Software Development</h2>
    {% for p in projects %}
        <div class="project">
	  <span class="name">{% if p.link %}<a href="{{ p.link }}">{{ p.title }}</a>{% else %}{{ p.title }}{% endif %}</span>
	  <span class="details">— {{p.details | markdownify}}</span>
        </div>
    {% endfor %}
</section>
{% endif %}
